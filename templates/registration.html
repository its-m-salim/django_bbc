{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Регистрация</h1>
    <p class="muted">На почту придёт код подтверждения.</p>

    {% if error %}<p class="alert">{{ error }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}

        <label class="label" for="username">Логин</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required>

        <label class="label" for="email">Почта</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>

        <label class="label" for="password">Пароль</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>

        <div class="actions">
            <button class="btn" type="submit">Создать аккаунт</button>
        </div>
    </form>

    <p class="muted small">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
