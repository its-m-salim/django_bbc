{% extends "base.html" %}

{% block title %}Новая статья{% endblock %}

{% block content %}
<div class="card">
    <h1>Новая статья</h1>
    <p class="muted">Статья сохранится как черновик. Отправить на проверку можно из раздела «Мои статьи».</p>

    <form method="post">
        {% csrf_token %}

        <label class="label" for="title">Заголовок</label>
        <input class="input" id="title" name="title" type="text" required>

        <label class="label" for="category">Категория</label>
        <select class="input" id="category" name="category" required>
            {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>

        <label class="label" for="content">Текст</label>
        <textarea class="input input-tall" id="content" name="content" required></textarea>

        <div class="actions">
            <button class="btn" type="submit">Сохранить черновик</button>
            <a class="btn btn-light" href="{% url 'my_articles' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
