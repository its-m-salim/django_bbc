{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Вход</h1>

    {% if error %}<p class="alert">{{ error }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}

        <label class="label" for="username">Логин</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required>

        <label class="label" for="password">Пароль</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>

        <div class="actions">
            <button class="btn" type="submit">Войти</button>
        </div>
    </form>

    <p class="muted small">Нет аккаунта? <a href="{% url 'registration' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
